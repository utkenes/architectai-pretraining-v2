    category: system_design
    enabled: true
    type: local_directory
    path: "${ARCHITECT_DATA_DIR}/500lines-master"
    license_id: CC-BY-3.0
    allow_unverified_license: true
    license_training_status: mixed
    release_eligible: true
    license_review_status: approved_path_scoped
    license_evidence_path: LICENSE.md
    allowed_content_types: [markdown]
    include_patterns: ["**/*.md", "**/*.markdown"]
    exclude_patterns: ["LICENSE*", "README*", "BUILD*", "requirements*", "**/code/**", "**/images/**", "**/assets/**", "**/static/**", "**/node_modules/**"]
    source_token_cap: 100000
    source_priority: 1.0
    notes: "Written chapter prose only; mixed prose/code licensing is path scoped."
    license_policy:
      mode: path_scoped
