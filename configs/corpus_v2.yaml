# Read-only local experimental DAPT corpus. License uncertainty is preserved
# as metadata and release_eligible controls later public/commercial filtering.
corpus_version: architecture-corpus-v2-experimental
target_tokens: 1000000
token_tolerance: 0.05
seed: 42
max_section_tokens: 2400
tokenizer: {identifier: Qwen/Qwen3-8B, revision: main}
quality: {min_architecture_relevance_score: 0.40, max_link_ratio: 0.22, max_code_ratio: 0.55}
balancing:
  max_source_token_share: 0.15
  category_tolerance: 0.05
  allow_preview_backfill: true
  allow_freeze_backfill: false
  category_token_targets: {software_architecture: 0.20, distributed_systems: 0.15, system_design: 0.10, reliability_resilience: 0.17, database_data_architecture: 0.17, adr_decision_reasoning: 0.15, domain_driven_design: 0.02, messaging_event_driven: 0.01, ai_agent_architecture: 0.01, networking_systems: 0.02}
split: {train_ratio: 0.90, validation_ratio: 0.05, heldout_ratio: 0.05}

