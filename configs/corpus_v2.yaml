        - {content: written_material, license_id: CC-BY-3.0, training_enabled: true, evidence_path: LICENSE.md, include_patterns: ["**/*.md", "**/*.markdown"], exclude_patterns: ["LICENSE*", "README*", "BUILD*", "**/code/**", "**/images/**", "**/assets/**"]}
