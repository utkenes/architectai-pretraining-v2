# Read-only local experimental DAPT corpus. License uncertainty is preserved
# as metadata and release_eligible controls later public/commercial filtering.
corpus_version: architecture-corpus-v2-experimental
target_tokens: 1000000
token_tolerance: 0.05
seed: 42
max_section_tokens: 2400
tokenizer: {identifier: Qwen/Qwen3-8B, revision: main}
quality: {min_architecture_relevance_score: 0.40, max_link_ratio: 0.22, max_code_ratio: 0.55}
balancing:
  max_source_token_share: 0.15
  category_tolerance: 0.05
  allow_preview_backfill: true
  allow_freeze_backfill: false
  category_token_targets: {software_architecture: 0.20, distributed_systems: 0.15, system_design: 0.10, reliability_resilience: 0.17, database_data_architecture: 0.17, adr_decision_reasoning: 0.15, domain_driven_design: 0.02, messaging_event_driven: 0.01, ai_agent_architecture: 0.01, networking_systems: 0.02}
split: {train_ratio: 0.90, validation_ratio: 0.05, heldout_ratio: 0.05}

sources:
  - id: five_hundred_lines
    name: "500 Lines or Less"
    category: system_design
    enabled: true
    type: local_directory
    path: "${ARCHITECT_DATA_DIR}/500lines-master"
    license_id: CC-BY-3.0
    allow_unverified_license: true
    license_training_status: mixed
    release_eligible: true
    license_review_status: approved_path_scoped
    license_evidence_path: LICENSE.md
    allowed_content_types: [markdown]
    include_patterns: ["**/*.md", "**/*.markdown"]
    exclude_patterns: ["LICENSE*", "README*", "BUILD*", "requirements*", "**/code/**", "**/images/**", "**/assets/**", "**/static/**", "**/node_modules/**"]
    source_token_cap: 100000
    source_priority: 1.0
    notes: "Written chapter prose only; mixed prose/code licensing is path scoped."
    license_policy:
      mode: path_scoped
      rules:
        - {content: written_material, license_id: CC-BY-3.0, training_enabled: true, evidence_path: LICENSE.md, include_patterns: ["**/*.md", "**/*.markdown"], exclude_patterns: ["LICENSE*", "README*", "BUILD*", "**/code/**", "**/images/**", "**/assets/**"]}
        - {content: software, license_id: MIT, training_enabled: false, evidence_path: LICENSE.md, include_patterns: ["**/*"]}
  - {id: seven_edition, name: "Computer Networks 7E", category: networking_systems, enabled: true, type: local_directory, path: "${ARCHITECT_DATA_DIR}/7E-main", license_id: CC-BY-4.0, verify_license: true, license_training_status: approved, release_eligible: true, license_review_status: approved, license_evidence_path: LICENSE, allowed_content_types: [restructuredtext], include_patterns: ["*.rst"], exclude_patterns: ["README*", "LICENSE*", "CONTRIBUTING*", "index.rst", "authors.rst", "chapters.rst", "_*/**", ".github/**"], source_token_cap: 100000, source_priority: 1.0, notes: "Chapter prose; lower priority than newer edition."}
  - {id: agent_driven_architecture, name: "Agent Driven Architecture", category: ai_agent_architecture, enabled: true, type: local_directory, path: "${ARCHITECT_DATA_DIR}/agent-driven-architecture-main", license_id: CC-BY-4.0, verify_license: true, license_training_status: approved, release_eligible: true, license_review_status: approved, license_evidence_path: LICENSE, allowed_content_types: [markdown], include_patterns: ["docs/**/*.md", "wiki/**/*.md"], exclude_patterns: ["README*", "LICENSE*", "CHANGELOG*", "examples/**", "dev/**", ".github/**", ".claude/**"], source_token_cap: 75000, source_priority: 1.0, notes: "Architecture prose only."}
  - {id: adr_guidance, name: "ADR Guidance", category: adr_decision_reasoning, enabled: true, type: local_directory, path: "${ARCHITECT_DATA_DIR}/architecture-decision-record-main", license_id: CC-BY-NC-SA-4.0, allow_unverified_license: true, license_training_status: noncommercial, release_eligible: false, license_review_status: license_blocked, license_evidence_path: LICENSE.md, allowed_content_types: [markdown], include_patterns: ["README.md", "locales/en/**/*.md"], exclude_patterns: ["**/*template*.md", "LICENSE*", "CHANGELOG*", ".github/**"], source_token_cap: 80000, source_priority: 1.0, notes: "Experimental only; NC terms make it release-ineligible."}
  - {id: adr_records, name: "ADR Example Collection", category: adr_decision_reasoning, enabled: true, type: local_directory, path: "${ARCHITECT_DATA_DIR}/architecture-decision-records-master", license_id: CC0-1.0, verify_license: true, license_training_status: approved, release_eligible: true, license_review_status: approved, license_evidence_path: LICENSE, allowed_content_types: [markdown], include_patterns: ["docs/**/*.md"], exclude_patterns: ["**/*template*.md", "README*", "LICENSE*", "CHANGELOG*", ".github/**", "scripts/**"], source_token_cap: 80000, source_priority: 1.0, notes: "Actual decision records only."}
