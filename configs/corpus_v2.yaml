  - {id: data_for_saas, name: "Data for SaaS Patterns", category: database_data_architecture, enabled: true, type: local_directory, path: "${ARCHITECT_DATA_DIR}/data-for-saas-patterns-main", license_id: MIT-0, verify_license: true, license_training_status: approved, release_eligible: true, license_review_status: approved, license_evidence_path: LICENSE, allowed_content_types: [markdown], include_patterns: ["reference-architectures/**/*.md"], exclude_patterns: ["**/README*", "**/LICENSE*", "samples/**"], source_token_cap: 80000, source_priority: 1.0, notes: "MIT No Attribution (MIT-0) architecture prose."}
  - {id: distributed_systems_guide, name: "Distributed Systems Guide", category: distributed_systems, enabled: true, type: local_directory, path: "${ARCHITECT_DATA_DIR}/Distributed-Systems-Guide-main", license_id: null, allow_unverified_license: true, license_training_status: unverified, release_eligible: false, license_review_status: needs_manual_review, allowed_content_types: [markdown], include_patterns: ["README.md"], source_token_cap: 30000, source_priority: 0.7, notes: "Explanatory prose only; link/tool catalogs rejected."}
  - {id: distsysbook, name: "Distributed Systems Book", category: distributed_systems, enabled: true, type: local_directory, path: "${ARCHITECT_DATA_DIR}/distsysbook-master", license_id: null, allow_unverified_license: true, license_training_status: custom_terms, release_eligible: false, license_review_status: license_blocked, allowed_content_types: [markdown], include_patterns: ["input/**/*.md"], exclude_patterns: ["input/0_index.md", "**/README*", "docs/**"], source_token_cap: 100000, source_priority: 1.0, notes: "Custom/restrictive author terms; no general training-compatible license verified."}
  - {id: domain_driven_hexagon, name: "Domain Driven Hexagon", category: domain_driven_design, enabled: true, type: local_directory, path: "${ARCHITECT_DATA_DIR}/domain-driven-hexagon-master", license_id: MIT, verify_license: true, license_training_status: approved, release_eligible: true, license_review_status: approved, license_evidence_path: LICENSE, allowed_content_types: [markdown], include_patterns: ["README.md"], exclude_patterns: ["LICENSE*"], source_token_cap: 75000, source_priority: 1.05, strip_section_patterns: ["table of contents", "additional resources", "installation", "getting started", "running the project"], section_category_rules: {"bounded context": domain_driven_design, "domain-driven": domain_driven_design, "hexagonal": domain_driven_design, "architecture": software_architecture}, notes: "README conceptual prose; TOC/link/setup/code-heavy sections filtered."}
  - {id: engineering_handbook, name: "Engineering Handbook", category: software_architecture, enabled: true, type: local_directory, path: "${ARCHITECT_DATA_DIR}/engineering-handbook-main", license_id: CC-BY-SA-4.0, verify_license: true, license_training_status: approved, release_eligible: true, license_review_status: approved, license_evidence_path: LICENSE, allowed_content_types: [markdown], include_patterns: ["content/**/*architecture*.md", "content/**/*design*.md", "content/**/*reliab*.md", "content/**/*system*.md", "content/**/*hld*.md"], exclude_patterns: ["**/README*", "**/CONTRIBUTING*", "writing-guides/**", "scripts/**", ".github/**", "LICENSE*"], source_token_cap: 90000, source_priority: 0.95, notes: "Strict cap; selected HLD, architecture, design, reliability prose."}
  - {id: llm_prompts, name: "LLM Prompts", category: ai_agent_architecture, enabled: true, type: local_directory, path: "${ARCHITECT_DATA_DIR}/LLM-Prompts-main", license_id: null, allow_unverified_license: true, license_training_status: unverified, release_eligible: false, license_review_status: needs_manual_review, allowed_content_types: [markdown, asciidoc], include_patterns: ["src/docs/descriptions/**/*.adoc", "src/docs/descriptions/**/*.md"], exclude_patterns: ["README*", "CONTRIBUTING*", ".github/**", "prompts/**", "src/docs/Prompts/**", "src/docs/navigation.adoc", ".claude/**"], source_token_cap: 20000, source_priority: 0.5, notes: "Very low quota; descriptive architecture reasoning only, generic prompt templates excluded."}
