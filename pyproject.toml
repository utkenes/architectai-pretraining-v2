[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "architectai-pretraining"
version = "0.1.0"
description = "Domain-adaptive pretraining corpus preparation pipeline for software architecture LLMs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "ArchitectAI Team"}
]
keywords = ["llm", "pretraining", "dapt", "software-architecture", "nlp", "corpus"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
tokenization = [
    "transformers>=4.51,<5",
    "tokenizers>=0.21,<1",
]
benchmark = [
    "transformers>=4.51,<5",
    "accelerate>=1.0,<2",
    "bitsandbytes>=0.43,<1",
]
training = [
    "torch>=2.3",
    "transformers>=4.51,<5",
    "datasets>=3.0,<4",
    "accelerate>=1.0,<2",
    "peft>=0.14,<1",
]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-pyyaml>=6.0.0",
    "types-requests>=2.28.0",
]

[project.scripts]
architectai-pretraining = "architectai_pretraining.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
cache_dir = "scratch/mypy_cache"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --basetemp=scratch/pytest_tmp"


